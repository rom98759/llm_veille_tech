[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille"
version = "0.1.0"
description = "Veille technologique locale : collecte, tri, résumé par LLM local, rapport avec sources"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "trafilatura>=1.8,<3",
  "pyyaml>=6.0,<7",
  "jinja2>=3.1,<4",
  "markdown>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
veille = "veille.cli:main"

[tool.setuptools.packages.find]
include = ["veille*"]

[tool.setuptools.package-data]
veille = ["templates/*", "prompts/*"]

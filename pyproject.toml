[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille"
version = "0.1.0"
description = "Veille technologique locale : collecte, tri, résumé par LLM local, rapport avec sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "trafilatura>=1.8,<3",
  "pyyaml>=6.0,<7",
  "jinja2>=3.1,<4",
  "markdown>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "pre-commit>=4,<5"]

[project.scripts]
veille = "veille.cli:main"

[tool.setuptools.packages.find]
include = ["veille*"]

[tool.setuptools.package-data]
veille = ["templates/*", "prompts/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 : texte en français (apostrophes typographiques, ×, «») volontaire
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"veille/prompts.py" = ["E501"]  # prompts : lignes longues assumées

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

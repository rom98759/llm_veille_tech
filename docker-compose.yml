services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # GPU NVIDIA : décommenter
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  veille:
    build: .
    depends_on: [ollama]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - TZ=Europe/Paris
    # base_url dans config.yaml : http://ollama:11434/v1
    profiles: [job]   # lancé à la demande / par cron : docker compose run --rm veille

  # Sert les rapports HTML sur http://<lab>:8080/latest.html
  web:
    image: nginx:alpine
    volumes: ["./reports:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]

volumes:
  ollama:

# Copier en config.yaml puis adapter.
# Tester les sources : veille check-feeds   |   plus de sources : sources/catalog.yaml

llm:
  # N'importe quel serveur compatible OpenAI : Ollama, llama.cpp server, LM Studio, vLLM...
  base_url: http://localhost:11434/v1
  api_key: ollama            # ignoré par Ollama
  model: qwen3:8b            # cf. README « Choix du modèle » ; un 4B tourne mais synthétise mal
  temperature: 0.2
  timeout: 300
  max_input_chars: 6000      # texte d'article envoyé au modèle (tronqué)
  max_workers: 2             # appels LLM en parallèle ; côté Ollama : OLLAMA_NUM_PARALLEL >= cette valeur
  extra_body: {}             # ajouté tel quel à chaque requête, ex. pour couper la réflexion des modèles qwen3 :
  # extra_body: {reasoning_effort: none}   # à tester selon ta version d'Ollama

storage:
  db_path: data/veille.db
  reports_dir: reports

pipeline:
  lookback_days: 2           # fenêtre couverte par un rapport
  max_age_days: 14           # collecte : ignorer les articles plus vieux (historique CISA KEV, archives…)
  candidates_per_axis: 25    # pré-tri heuristique -> jugés par le LLM
  keep_per_axis: 8           # articles retenus et résumés par axe
  min_llm_score: 6           # seuil (0-10), note calculée par grille : fait nouveau, concret, actionnable…
  fetch_full_text: true      # extraire le contenu de la page (trafilatura)
  language: français         # langue du rapport

# Profil global : ce qui t'intéresse / ce qui est du bruit. Injecté dans le prompt de notation.
profile: |
  Ingénieur infra/sécu qui gère un homelab. Intéressé par : nouveautés techniques concrètes,
  sorties de versions majeures, vulnérabilités exploitées, outils open source, papiers/benchmarks IA.
  Peu intéressé par : levées de fonds, marketing, rumeurs, contenus sponsorisés, listicles.

# Flux partagés : chaque article est routé vers les axes dont les mots-clés matchent.
shared_feeds:
  - name: Hacker News (front page)
    url: "https://hnrss.org/frontpage?points=100"
    weight: 1.2
  - name: Lobsters
    url: "https://lobste.rs/rss"
    weight: 1.0

axes:
  tech:
    title: Tech globale
    description: Infra, dev, cloud, open source, matériel, OS.
    keywords: [linux, kernel, kubernetes, docker, rust, python, postgres, release, open source, cloud, cpu, gpu]
    feeds:
      - {name: LWN, url: "https://lwn.net/headlines/rss", weight: 1.3}
      - {name: The Register, url: "https://www.theregister.com/headlines.atom", weight: 1.0}
      - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/technology-lab", weight: 1.0}

  ia:
    title: Intelligence artificielle
    description: Modèles, recherche, outils, inférence locale, régulation.
    keywords: [llm, model, gpt, claude, llama, mistral, qwen, transformer, inference, agent, rag, diffusion, fine-tuning, "ai act"]
    feeds:
      - {name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", weight: 1.3}
      - {name: Simon Willison, url: "https://simonwillison.net/atom/everything/", weight: 1.3}
      - {name: OpenAI News, url: "https://openai.com/news/rss.xml", weight: 1.1}
      - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", weight: 1.1}
      - {name: arXiv cs.CL, url: "https://rss.arxiv.org/rss/cs.CL", weight: 0.7}
      - {name: r/LocalLLaMA, url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day", weight: 1.0}

  cyber:
    title: Cybersécurité
    description: Vulnérabilités, campagnes, incidents, outils défensifs.
    keywords: [cve, vulnerability, exploit, ransomware, malware, zero-day, 0day, patch, breach, apt, phishing, rce]
    feeds:
      - {name: CERT-FR, url: "https://www.cert.ssi.gouv.fr/feed/", weight: 1.4}
      - {name: CISA KEV, url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", kind: cisa_kev, weight: 1.5}
      - {name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/", weight: 1.1}
      - {name: The Hacker News, url: "https://feeds.feedburner.com/TheHackersNews", weight: 1.0}
      - {name: Krebs on Security, url: "https://krebsonsecurity.com/feed/", weight: 1.2}
      - {name: SANS ISC, url: "https://isc.sans.edu/rssfeed_full.xml", weight: 1.0}

  # Ajoute tes propres axes ici, ex :

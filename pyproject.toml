[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille"
version = "0.1.0"
description = "Veille technologique locale : collecte, tri, résumé par LLM local, rapport avec sources"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "trafilatura>=1.8",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
veille = "veille.cli:main"

[tool.setuptools.packages.find]
include = ["veille*"]

[tool.setuptools.package-data]
veille = ["templates/*", "prompts/*"]
